name: 藥局追蹤器

on:
  schedule:
    # 每週一、四台灣時間 08:00（UTC 前一天 00:00）
    # 2026-07-31：試跑每週兩次。325點 x ~8.7次/月 約2,814次/月，
    # 佔新版 Places API 免費額度(5,000次/月)的56%，仍留有緩衝空間。
    - cron: "0 0 * * 1,4"
  workflow_dispatch:   # 也可以手動觸發，方便測試

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install gspread google-auth requests tenacity

      - name: 寫入 Google 憑證
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: 執行追蹤
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          LINE_TOKEN:     ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID:   ${{ secrets.LINE_USER_ID }}
        run: python pharmacy_tracker.py

      - name: 清除憑證
        if: always()
        run: rm -f credentials.json
